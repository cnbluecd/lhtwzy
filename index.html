<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南无阿弥陀佛</title>
    <style>
        /* 页面整体布局 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex; /* 使用Flexbox布局使内容居中 */
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            background-color: #fdfbf7; /* 柔和的米白色背景 */
            overflow: hidden; /* 防止滚动条出现 */
        }

        /* 文字样式设计 */
        .buddha-text {
            /* 优先使用楷体等书法字体，如果没有则使用衬线体 */
            font-family: "Kaiti SC", "STKaiti", "KaiTi", "SimKai", "Songti SC", serif;
            
            /* 响应式字体大小：最小3rem，最大8rem，根据视口宽度自动调整 */
            font-size: clamp(3rem, 10vw, 8rem);
            
            /* 深金色，庄重且不刺眼 */
            color: #B8860B; 
            
            /* 字间距，增加呼吸感 */
            letter-spacing: 0.15em;
            
            /* 竖排排版 (可选) - 如果您喜欢传统的竖排，取消下面这行的注释 */
            /* writing-mode: vertical-rl; */
            
            /* 简单的文字阴影，增加立体感 */
            text-shadow: 2px 2px 8px rgba(184, 134, 11, 0.2);
            
            /* 防止文字被选中，保持页面整洁 */
            user-select: none;
            cursor: default;
        }

        /* 简单的淡入动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 2s ease-out;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="buddha-text">南无阿弥陀佛</div>
    </div>
</body>
</html>
